<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flowmoro Privacy Policy | Modrn Magic</title>
  <link rel="canonical" href="https://modrnmagic.app/apps/flowmoro/privacy/">
  <style>
    :root { color-scheme: light dark; }
    body { max-width: 68ch; margin: 0 auto; padding: 32px 16px 64px; font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: inherit; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>


<div id="termsOfService">
  <!-- The privacy policy text will be loaded here -->
</div>

<script>
// JavaScript to load the privacy policy text and render markdown
fetch('privacy-policy.md')
  .then(response => response.text())
  .then(markdown => {
    const html = marked.parse(markdown); // Convert markdown to HTML
    document.getElementById('termsOfService').innerHTML = html;
  })
  .catch(error => {
    console.error('Error fetching the terms of service:', error);
    document.getElementById('termsOfService').innerHTML = 'Error loading the privacy policy.';
  });

</script>

</body>
</html>

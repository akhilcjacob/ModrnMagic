# Lean CI: the launch checklist gates (_docs/APPS.md) on every PR and on main.
# No secrets. The click suite runs in Chromium only; Firefox and WebKit run locally through qa-run.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python3 --version
      - run: python3 _scripts/check.py --release
      - run: python3 _scripts/render.py --check
      - run: python3 _scripts/render.py --release --check

  e2e-chromium:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: _tests/requirements.txt
      - run: pip install -r _tests/requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 _tests/run.py --browser=chromium
